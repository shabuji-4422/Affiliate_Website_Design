{{- /* NextCart logo: cart mark + stacked wordmark. Pass a dict with "class" for color variants. */ -}}
<a class="logo {{ .class }}" href="{{ "/" | relURL }}" aria-label="NextCart home">
  <svg class="logo-mark" viewBox="0 0 48 48" width="44" height="44" aria-hidden="true" focusable="false">
    <rect class="lm-bg" width="48" height="48" rx="13" fill="#17252A"/>
    <path d="M8.5 12.5h4.6l4.1 17.5h17.6l3.9-12.6H14.9" fill="none" stroke="#FEFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="lm-arrow" d="M20.5 23.6h10.4M27 19.6l4 4-4 4" fill="none" stroke="#3AAFA9" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20.2" cy="36.4" r="2.7" fill="#FEFFFF"/>
    <circle cx="32.2" cy="36.4" r="2.7" fill="#FEFFFF"/>
  </svg>
  <span class="logo-word"><span>Next</span><span>Cart</span></span>
</a>

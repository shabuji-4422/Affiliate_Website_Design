<article class="card">
  <a class="card-link" href="{{ .RelPermalink }}">
    {{- with .GetTerms "departments" }}<span class="card-dept">{{ (index . 0).Title }}</span>{{ else }}{{ with .GetTerms "collections" }}<span class="card-dept">{{ (index . 0).Title }}</span>{{ end }}{{ end }}
    <h3 class="card-title">{{ .Title }}</h3>
    <p class="card-summary">{{ or .Description .Summary | plainify | truncate 140 }}</p>
    <span class="card-meta">Updated {{ .Lastmod.Format "Jan 2, 2006" }}</span>
  </a>
</article>
